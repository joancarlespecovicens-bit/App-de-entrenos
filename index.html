<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Entreno">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0a6cff">
<title>Mi diario de entrenamiento</title>
<style>
:root{--bg:#f2f2f7;--s:#fff;--s2:#eeeef3;--t:#111;--m:#6c6c75;--a:#0a6cff;--g:#8a5a00;--gb:#ffeaa8;--ok:#1e9e4f;--bd:#d9d9e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--s:#1c1c1e;--s2:#2c2c2e;--t:#f2f2f7;--m:#98989f;--a:#0a84ff;--g:#ffd60a;--gb:#3a3000;--ok:#30a14e;--bd:#38383a}}
:root[data-theme="dark"]{--bg:#000;--s:#1c1c1e;--s2:#2c2c2e;--t:#f2f2f7;--m:#98989f;--a:#0a84ff;--g:#ffd60a;--gb:#3a3000;--ok:#30a14e;--bd:#38383a}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--t);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:8px 16px 96px;max-width:560px;font-variant-numeric:tabular-nums}
body{background:var(--bg)}html{background:var(--bg)}
h1{font-size:34px;margin:24px 0 12px}
.card{background:var(--s);border-radius:14px;padding:12px 16px;margin:0 0 14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;cursor:pointer}
.sub{border-top:1px solid var(--bd)}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--a);color:#fff;font-family:inherit;font-size:17px;font-weight:600;padding:12px;cursor:pointer}
.big{padding:16px;margin-bottom:14px}
.add{display:grid;gap:10px}
.in{width:100%;background:var(--s2);border:0;border-radius:10px;padding:10px 12px;color:var(--t);font-size:16px;font-family:inherit}
.n{text-align:center;padding:10px 4px}
.lk{background:none;border:0;color:var(--a);font-size:16px;padding:8px 0;cursor:pointer;font-family:inherit}
.red{color:#ff453a}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:12px 0}
.hd>:first-child{justify-self:start}.hd>:last-child{justify-self:end}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chip{display:grid;gap:2px;width:64px;text-align:center}
.sh,.sr{display:grid;grid-template-columns:26px 1fr 1fr 54px 44px;gap:6px;align-items:center;text-align:center;margin-top:8px}
.sh{color:var(--m);font-size:13px}
.ck{width:44px;height:40px;border-radius:10px;border:2px solid var(--bd);background:none;color:#fff;font-size:20px;cursor:pointer}
.dn .ck{background:var(--ok);border-color:var(--ok)}
.pr{background:var(--gb);color:var(--g);border-radius:8px;padding:4px 10px;margin-top:6px;font-weight:600;font-size:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--s);border-top:1px solid var(--bd);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;background:none;border:0;color:var(--m);font-size:14px;padding:8px;font-family:inherit;cursor:pointer}
.tabs .on{color:var(--a);font-weight:700}
.m{color:var(--m)}.sm{font-size:14px}.ac{color:var(--a);font-size:18px}.h2{font-size:18px}
.ch{width:100%;height:auto}.ax{font-size:10px;fill:var(--m)}
.seg{display:flex;gap:6px;margin:8px 0 12px}
.seg button{flex:1;padding:8px 2px;border-radius:9px;border:0;background:var(--s2);color:var(--t);font-family:inherit;cursor:pointer}
.seg .on{background:var(--a);color:#fff}
.msg{color:#ff453a;margin:0 0 10px}
.stat{display:flex;justify-content:space-between;padding:6px 0}
#rest{position:fixed;left:12px;right:12px;bottom:calc(68px + env(safe-area-inset-bottom,0px));background:var(--a);color:#fff;border-radius:14px;padding:4px 14px;align-items:center;justify-content:space-between;gap:8px;max-width:536px;margin:0 auto;z-index:5}
#rest .lk{color:#fff;padding:8px 6px}
button:focus-visible,input:focus-visible{outline:2px solid var(--a);outline-offset:2px}
</style></head>
<body><div id="app"></div><div id="rest" style="display:none"></div><nav class="tabs" id="tabs"></nav>
<script>
const K='diario-entreno-v1';
const LIB=[];('Pecho|Press banca con barra,Press banca inclinado con barra,Press banca declinado,Press con mancuernas,Press inclinado con mancuernas,Aperturas con mancuernas,Cruces en polea,Fondos en paralelas,Flexiones,Pec deck (contractor),Press de pecho en máquina;Espalda|Dominadas,Dominadas supinas,Jalón al pecho,Remo con barra,Remo con mancuerna,Remo en polea baja,Remo en máquina,Remo en T,Peso muerto convencional,Pullover en polea,Hiperextensiones,Encogimientos de trapecio;Hombros|Press militar con barra,Press de hombros con mancuernas,Press Arnold,Elevaciones laterales,Elevaciones frontales,Pájaros (deltoide posterior),Face pull;Bíceps|Curl con barra,Curl con mancuernas,Curl martillo,Curl en banco predicador,Curl en polea,Curl concentrado;Tríceps|Press francés,Extensión de tríceps en polea,Fondos en banco,Extensión sobre la cabeza con mancuerna,Press banca agarre cerrado,Patada de tríceps;Cuádriceps|Sentadilla con barra,Sentadilla frontal,Sentadilla búlgara,Sentadilla goblet,Prensa de piernas,Hack squat,Extensión de cuádriceps,Zancadas con mancuernas,Zancadas caminando,Step-up;Femoral y glúteo|Peso muerto rumano,Peso muerto a una pierna,Curl femoral sentado,Curl femoral tumbado,Hip thrust con barra,Puente de glúteo,Patada de glúteo en polea,Buenos días,Abducción de cadera en máquina;Gemelos|Elevación de talones de pie,Elevación de talones sentado,Elevación de talones en prensa;Abdomen|Plancha,Plancha lateral,Crunch,Crunch en polea,Elevación de piernas colgado,Rueda abdominal,Russian twist,Dead bug;Cuerpo completo|Balanceo con kettlebell,Paseo del granjero,Burpees').split(';').forEach(g=>{const p=g.split('|');p[1].split(',').forEach(n=>LIB.push([n,p[0]]))});
const TECH=[
['Drop set','alta','Al llegar al fallo, bajas el peso un 20-30% y sigues sin descanso. Se repite 1-2 veces. Mejor en la última serie de ejercicios de aislamiento.'],
['Rest-pause','alta','Serie hasta el fallo, descansas 10-20 s y haces más repeticiones con el mismo peso. Se repite 2-3 veces.'],
['Myo-reps','alta','Una serie de activación cerca del fallo y después mini-series de pocas repeticiones con descansos muy cortos.'],
['Cluster set','alta','La serie se divide en bloques de pocas repeticiones con pausas de 10-20 s, para mantener el peso alto sin llegar a la fatiga fuerte.'],
['Serie al fallo','alta','Llegas hasta no poder hacer otra repetición con buena técnica. Mejor en la última serie.'],
['Repeticiones forzadas','alta','Tras el fallo, un compañero te ayuda lo justo para completar 1-3 repeticiones más.'],
['Repeticiones negativas','alta','Bajas el peso muy despacio (3-5 s), con una carga algo superior a la habitual y, si puedes, con ayuda para subirlo.'],
['Parciales','alta','Tras el fallo, repeticiones de rango corto en la parte del recorrido que aún puedes mover.'],
['Superserie','alta','Dos ejercicios seguidos sin descanso: de músculos opuestos (bíceps y tríceps) o del mismo músculo.'],
['Serie gigante','alta','Tres o más ejercicios seguidos sin descanso.'],
['Pre-agotamiento','alta','Un ejercicio de aislamiento antes del compuesto para fatigar antes el músculo que quieres trabajar.'],
['Series de aproximación','baja','Series ligeras y progresivas antes de la primera serie efectiva, para calentar y practicar el gesto.'],
['Series con RIR 3-4','baja','Paras con 3-4 repeticiones en reserva. Sirve para aprender técnica y acumular volumen con poca fatiga.'],
['Tempo controlado','baja','Ritmo marcado, por ejemplo bajar en 3 s, pausa de 1 s y subir en 1 s, con peso moderado.'],
['Series de técnica','baja','Peso ligero y recorrido completo, centrado solo en ejecutar bien el movimiento.'],
['Isométrico suave','baja','Mantener una posición durante 20-45 s, como en la plancha, sin llegar al límite.'],
['Semana de descarga','baja','Una semana con menos peso o menos series para recuperarte antes de seguir progresando.']];
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const techOpts=s=>'<option value="">Sin técnica de intensidad</option>'+TECH.map(t=>`<option${t[0]==s?' selected':''}>${e(t[0])}</option>`).join('');
function ex(n,s){return{id:uid(),n:n,s:s}}
function uid(){return Math.random().toString(36).slice(2,9)}
function seed(){return{plans:[{id:'p1',name:'Progresiones',routines:[
{id:'r1',name:'Lunes',ex:[ex('Romanian Deadlift',[10,8,6,4]),ex('Hip thrust barra',[8,8,8,8]),ex('Leg Curl (Seated)',[10,10,10]),ex('Pull Up',[8,8,8]),ex('Row: Barbell (Bent Over)',[8,8,8,8]),ex('Plank',[5,5,5])]},
{id:'r2',name:'Miércoles',ex:[ex('Bench Press: Barbell',[8,8,8,8]),ex('Bench Press: Dumbbell (Incline)',[10,10,10])]},
{id:'r3',name:'Sábado',ex:[ex('Lunges: Dumbbell (Walking)',[10,10,10]),ex('Squat: Barbell',[8,8,8,8])]}]}],logs:[],active:null}}
function load(){try{const v=JSON.parse(localStorage.getItem(K));if(v&&v.plans)return v}catch(x){}return seed()}
let S=load(),stack=[{v:'home'}],ui={mode:'peso',arm:null,msg:''};
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(x){}}
const e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{v=parseFloat(String(v).replace(',','.'));return isNaN(v)?0:v};
const r1=v=>Math.round(v*10)/10;
const fmtD=t=>new Date(t).toLocaleDateString('es-ES',{day:'numeric',month:'short'});
const $=id=>document.getElementById(id);
const cur=()=>stack[stack.length-1];
const plan=id=>S.plans.find(p=>p.id==id);
const rt=c=>plan(c.pid).routines.find(r=>r.id==c.rid);
const allR=()=>S.plans.flatMap(p=>p.routines);
const exNames=()=>[...new Set([...S.logs.flatMap(l=>l.items.map(i=>i.n)),...allR().flatMap(r=>r.ex.map(x=>x.n))])].sort((a,b)=>a.localeCompare(b));
function allEx(){const k=new Set(LIB.map(x=>x[0]));return LIB.concat(exNames().filter(n=>!k.has(n)).map(n=>[n,'Mis ejercicios']))}
function findEx(q){q=norm(q.trim());return allEx().filter(x=>!q||norm(x[0]).includes(q)||norm(x[1]).includes(q))}
function sres(q){const r=findEx(q).slice(0,8),c=q.trim();return r.map(x=>`<div class="row sub" data-a="addLib" data-n="${e(x[0])}"><span>${e(x[0])}</span><span class="m sm">${e(x[1])}</span></div>`).join('')+(c&&!r.some(x=>norm(x[0])==norm(c))?`<div class="row sub" data-a="addLib" data-n="${e(c)}"><span class="ac">Crear «${e(c)}»</span></div>`:'')}
function lres(q){const g={};findEx(q).forEach(x=>(g[x[1]]=g[x[1]]||[]).push(x[0]));return Object.keys(g).map(c=>`<div class="m sm">${e(c)}</div><div class="card">${g[c].map(n=>{const B=bests(n);return`<div class="row sub" data-a="go" data-v="exd" data-n="${e(n)}"><div><span class="ac">${e(n)}</span>${B.n?`<div class="m sm">${B.n} ${B.n==1?'sesión':'sesiones'} · mejor ${B.mw?B.mw+' kg':(B.rw[0]||0)+' reps'}</div>`:''}</div><span class="m">›</span></div>`}).join('')}</div>`).join('')||'<div class="card m">No hay ejercicios con ese nombre. Puedes crearlo al añadirlo a una rutina.</div>'}
function dw(i,j,k){const it=S.active.items[i],s=it.sets[j];let w=num(s.w);for(let x=0;x<=k;x++){const q=s.dr[x];w=q.m?num(q.w):Math.round(w*(1-(it.pct||20)/100)*2)/2}return w}
function upd(i){S.active.items[i].sets.forEach((s,j)=>(s.dr||[]).forEach((q,k)=>{const el=document.querySelector('[data-f="dw"][data-i="'+i+'"][data-j="'+j+'"][data-k="'+k+'"]');if(el&&!q.m)el.value=dw(i,j,k)||''}))}
function upHint(it){if(!it.mx)return'';const l=lastSets(it.n);if(!l.length||!l.every(s=>s.r>=it.mx))return'';const w=Math.max(...l.map(s=>s.w));return w?`<div class="pr">⬆ Sube peso: ${w} → ${r1(w+(it.inc||2.5))} kg</div>`:`<div class="pr">⬆ Ya llegaste a ${it.mx} reps en todas las series: sube la dificultad</div>`}
let rEnd=0,rInt=null,rDone=0;
function rest(){const el=$('rest');rEnd=Date.now()+(S.rest||90)*1000;rDone=0;el.innerHTML='<b id="rtx"></b><span><button class="lk" data-a="rAdd">+15 s</button><button class="lk" data-a="rstop">Saltar</button></span>';el.style.display='flex';document.body.style.paddingBottom='150px';clearInterval(rInt);rInt=setInterval(tick,500);tick()}
function stopRest(){clearInterval(rInt);rEnd=0;const el=$('rest');el.innerHTML='';el.style.display='none';document.body.style.paddingBottom=''}
function tick(){const l=Math.ceil((rEnd-Date.now())/1000),t=$('rtx');if(!t)return;if(l>0){t.textContent='Descanso '+Math.floor(l/60)+':'+String(l%60).padStart(2,'0');return}t.textContent='¡Siguiente serie!';if(!rDone){rDone=1;try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(x){}}}
function lastInfo(n){for(let i=S.logs.length-1;i>=0;i--){const it=S.logs[i].items.find(x=>x.n==n);if(it)return`<div class="m sm">Última vez (${fmtD(S.logs[i].t)}): ${it.sets.filter(s=>!s.dp).map(s=>(s.w?s.w+'×'+s.r:s.r+' reps')+(s.x!=null?' RIR'+s.x:'')).join(' · ')}</div>`}return''}
const planD=p=>(p.ini?fmtD(p.ini):'…')+' – '+(p.fin?fmtD(p.fin):'…');
function vBk(){return hd('Copia de seguridad')+`<div class="card add"><b>Exportar</b><p class="m sm" style="margin:0">Copia este texto y guárdalo en tus notas o envíatelo. Sirve para recuperar tus datos o pasarlos a otro móvil o navegador.</p><textarea id="bx" class="in" rows="6" readonly>${e(JSON.stringify(S))}</textarea><button class="btn" data-a="cp">Copiar</button><div id="bm1" class="m sm"></div></div><div class="card add"><b>Importar</b><textarea id="bi" class="in" rows="4" placeholder="Pega aquí tu copia"></textarea><button class="btn" data-a="imp">Importar y reemplazar mis datos</button><div id="bm2" class="m sm"></div></div>`}
function itCtl(it,i){return lastInfo(it.n)+upHint(it)+(it.tech&&it.tech!='Drop set'?`<div class="m sm">Técnica: ${e(it.tech)}</div>`:'')+(it.dp?`<div class="stat"><span class="sm">Cada drop baja un</span><span><input class="in n" style="width:64px" type="number" inputmode="numeric" value="${it.pct||20}" aria-label="Porcentaje de bajada" data-f="pct" data-i="${i}"> %</span></div>`:'')+`<button class="lk sm" data-a="tdp" data-i="${i}">${it.dp?'Quitar drop sets':'Activar drop sets'}</button>`}
function dropRows(it,i,j,s){const dr=s.dr||[];if(!it.dp&&!dr.length)return'';const a=` data-i="${i}" data-j="${j}"`;
return dr.map((q,k)=>`<div class="sr${q.d?' dn':''}"><span class="m">↓</span><input class="in n" type="text" inputmode="decimal" value="${q.m?e(q.w):(dw(i,j,k)||'')}" aria-label="Peso del drop" data-f="dw"${a} data-k="${k}"><input class="in n" type="number" inputmode="numeric" value="${e(q.r)}" aria-label="Repeticiones del drop" data-f="dr"${a} data-k="${k}"><span></span><button class="ck" data-a="chkD"${a} data-k="${k}" aria-label="Marcar drop hecho">${q.d?'✓':''}</button></div>`).join('')+(it.dp?`<div><button class="lk sm" data-a="addDrop"${a}>+ Drop set</button>${dr.length?`<button class="lk sm" data-a="delDrop"${a} style="margin-left:14px">− Quitar drop</button>`:''}</div>`:'')}
function vTech(){let h='<h1>Técnicas</h1><p class="m sm">Formas de organizar las series según su intensidad. Tiempos y porcentajes son orientativos y habituales; empieza con poco y prioriza la técnica.</p>';
[['alta','Alta intensidad'],['baja','Baja intensidad']].forEach(g=>{h+=`<div class="m sm">${g[1]}</div><div class="card">${TECH.filter(t=>t[1]==g[0]).map(t=>`<div class="sub" style="padding:10px 0"><b>${e(t[0])}</b><div class="m sm">${e(t[2])}</div></div>`).join('')}</div>`});
return h+'<div class="card m sm">Para usar una técnica, elígela en el desplegable de cada ejercicio dentro de la rutina. Con «Drop set» se activan las series descendentes al entrenar.</div>'}
function bests(n){const B={n:0,mw:0,rw:{}};S.logs.forEach(l=>l.items.forEach(i=>{if(i.n!=n)return;B.n++;i.sets.forEach(s=>{if(s.dp)return;B.mw=Math.max(B.mw,s.w);B.rw[s.w]=Math.max(B.rw[s.w]||0,s.r)})}));return B}
function rec(B,w,r){if(!B.n||!r)return'';if(w>B.mw)return'peso';if((B.rw[w]||0)&&r>B.rw[w])return'reps';return''}
function lastSets(n){for(let i=S.logs.length-1;i>=0;i--){const it=S.logs[i].items.find(x=>x.n==n);if(it&&it.sets.length)return it.sets.filter(s=>!s.dp)}return[]}
const hd=(t,l)=>`<div class="hd"><button class="lk" data-a="back">‹ Atrás</button><b>${e(t)}</b><span>${l||''}</span></div>`;
const del=(k,txt)=>`<button class="lk red" data-a="${k.a}" ${k.at||''}>${ui.arm==k.id?'¿Seguro? Toca otra vez':txt}</button>`;

function vHome(){let h='<h1>Entrenar</h1>';
if(S.active)h+=`<div class="card"><b>${e(S.active.name)} en curso</b><button class="btn big" style="margin-top:10px" data-a="go" data-v="session">Continuar entrenamiento</button></div>`;
else h+='<button class="btn big" data-a="go" data-v="pick">Empezar entrenamiento</button>';
S.plans.forEach(p=>{h+=`<div class="card"><div class="row" data-a="go" data-v="plan" data-pid="${p.id}"><div><b class="h2">${e(p.name)}</b>${p.ini||p.fin?`<div class="m sm">${planD(p)}</div>`:''}</div><span class="m">›</span></div>${p.routines.map(r=>`<div class="row sub" data-a="go" data-v="routine" data-pid="${p.id}" data-rid="${r.id}"><div><span class="ac">${e(r.name)}</span><div class="m sm">${e(r.ex.map(x=>x.n).join(', ')||'Sin ejercicios')}</div></div></div>`).join('')}</div>`});
return h+'<div class="card add"><input id="np" class="in" placeholder="Nombre del nuevo plan"><button class="btn" data-a="addPlan">Crear plan</button></div><div class="card"><div class="row" data-a="go" data-v="bk"><span>Copia de seguridad</span><span class="m">›</span></div></div>'}

function vPick(){let h=hd('Elige rutina');S.plans.forEach(p=>{h+=`<div class="m sm">${e(p.name)}</div><div class="card">${p.routines.map(r=>`<div class="row sub" data-a="start" data-rid="${r.id}"><span class="ac">${e(r.name)}</span><span class="m sm">${r.ex.length} ejercicios</span></div>`).join('')||'<span class="m">Este plan aún no tiene rutinas.</span>'}</div>`});return h}

function vPlan(c){const p=plan(c.pid);let h=hd('Plan');
h+=`<div class="card"><input class="in" value="${e(p.name)}" data-f="pname" aria-label="Nombre del plan"><div class="stat"><span class="sm">Inicio</span><input class="in" style="width:auto" type="date" value="${e(p.ini||'')}" data-f="pini"></div><div class="stat"><span class="sm">Fin</span><input class="in" style="width:auto" type="date" value="${e(p.fin||'')}" data-f="pfin"></div></div><div class="m sm">Rutinas</div><div class="card">${p.routines.map(r=>`<div class="row sub" data-a="go" data-v="routine" data-pid="${p.id}" data-rid="${r.id}"><div><span class="ac">${e(r.name)}</span><div class="m sm">${r.ex.length} ejercicios</div></div><span class="m">›</span></div>`).join('')||'<span class="m">Sin rutinas todavía.</span>'}</div>`;
h+=`<div class="card add"><input id="nr" class="in" placeholder="Nombre de la rutina (ej. Viernes)"><button class="btn" data-a="addRoutine">Añadir rutina</button></div>`;
return h+'<button class="btn" style="margin-bottom:10px" data-a="dupPlan">Duplicar para el siguiente mesociclo</button>'+del({a:'delPlan',id:'dp'},'Eliminar plan')}

function vRoutine(c){const r=rt(c);let h=hd('Rutina');
h+=`<div class="card"><input class="in" value="${e(r.name)}" data-f="rname" aria-label="Nombre de la rutina"></div>`;
if(r.ex.length)h+=`<button class="btn big" data-a="start" data-rid="${r.id}">Empezar esta rutina</button>`;
h+='<div class="m sm">Ejercicios · repeticiones objetivo por serie</div>';
r.ex.forEach(x=>{h+=`<div class="card"><div class="row" style="cursor:default"><b>${e(x.n)}</b><button class="lk red" data-a="delEx" data-eid="${x.id}">Quitar</button></div><div class="sets">${x.s.map((v,i)=>`<label class="chip"><span class="m sm">Serie ${i+1}</span><input class="in n" type="number" inputmode="numeric" value="${v}" data-f="tgt" data-eid="${x.id}" data-i="${i}"></label>`).join('')}</div><div class="row" style="cursor:default"><button class="lk" data-a="addSet" data-eid="${x.id}">+ Serie</button><button class="lk" data-a="delSet" data-eid="${x.id}">− Serie</button></div><div class="stat"><span class="sm">Subir peso al llegar a (reps)</span><input class="in n" style="width:64px" type="number" inputmode="numeric" placeholder="–" value="${x.mx||''}" data-f="mx" data-eid="${x.id}"></div><div class="stat"><span class="sm">Subida (kg)</span><input class="in n" style="width:64px" type="text" inputmode="decimal" value="${x.inc||2.5}" data-f="inc" data-eid="${x.id}"></div><select class="in" data-f="tech" data-eid="${x.id}" aria-label="Técnica de intensidad">${techOpts(x.tech)}</select></div>`});
h+=`<div class="card add"><b>Añadir ejercicio</b><input id="ne" class="in" data-f="sq" placeholder="Busca en español (ej. sentadilla, pecho)" autocomplete="off"><div id="sres">${sres('')}</div></div>`;
return h+del({a:'delRoutine',id:'dr'},'Eliminar rutina')}

function vSession(){const a=S.active;if(!a)return vHome();
let h=`<div class="hd"><button class="lk red" data-a="disc">${ui.arm=='disc'?'¿Seguro?':'Descartar'}</button><b>${e(a.name)}</b><button class="lk" data-a="fin">Terminar</button></div>`;
if(ui.msg)h+=`<p class="msg">${e(ui.msg)}</p>`;
h+=`<div class="stat"><span class="sm">Descanso entre series (segundos)</span><input class="in n" style="width:72px" type="number" inputmode="numeric" value="${S.rest||90}" data-f="rs"></div>`;
a.items.forEach((it,i)=>{const B=bests(it.n);
h+=`<div class="card"><b class="h2">${e(it.n)}</b><div class="m sm">${B.n?(B.mw?'Mejor peso: '+B.mw+' kg':'Mejor: '+(B.rw[0]||0)+' reps'):'Primera vez: aún no hay récord que batir'}</div>${itCtl(it,i)}<div class="sh"><span>Serie</span><span>kg</span><span>Reps</span><span>RIR</span><span></span></div>`;
it.sets.forEach((s,j)=>{const r=s.d?rec(B,num(s.w),num(s.r)):'';
h+=`<div class="sr${s.d?' dn':''}"><span>${j+1}</span><input class="in n" type="text" inputmode="decimal" value="${e(s.w)}" placeholder="0" aria-label="Peso" data-f="sw" data-i="${i}" data-j="${j}"><input class="in n" type="number" inputmode="numeric" value="${e(s.r)}" aria-label="Repeticiones" data-f="sr" data-i="${i}" data-j="${j}"><input class="in n" type="number" inputmode="numeric" placeholder="–" value="${s.x==null?'':e(s.x)}" aria-label="Repeticiones en reserva" data-f="sx" data-i="${i}" data-j="${j}"><button class="ck" data-a="chk" data-i="${i}" data-j="${j}" aria-label="Marcar serie hecha">${s.d?'✓':''}</button></div>`+(r?`<div class="pr">🏆 ¡Récord de ${r=='peso'?'peso':'repeticiones'}!</div>`:'')+dropRows(it,i,j,s)});
h+=`<button class="lk" data-a="sAdd" data-i="${i}">+ Añadir serie</button></div>`});
return h+'<button class="btn big" data-a="fin">Terminar entrenamiento</button>'}

function vDone(c){const l=S.logs.find(x=>x.id==c.id);let h='<h1>¡Guardado!</h1>';if(!l)return h;
const rs=l.items.flatMap(i=>i.sets.filter(s=>s.rec).map(s=>`<div class="pr">🏆 ${e(i.n)}: ${s.w?s.w+' kg × '+s.r:s.r+' reps'} (${s.rec=='peso'?'más peso':'más repeticiones'})</div>`));
h+=`<div class="card"><b>${e(l.name)}</b><div class="m sm">${l.items.length} ejercicios · ${l.items.reduce((a,i)=>a+i.sets.length,0)} series</div></div>`;
h+=rs.length?`<div class="card"><b>Récords de hoy</b>${rs.join('')}</div>`:'<div class="card m">Hoy no hay récords. Vuelve a por ellos en el próximo entrenamiento.</div>';
return h+'<button class="btn big" data-a="home">Listo</button>'}

function vHist(){let h='<h1>Historial</h1>';
if(!S.logs.length)h+='<div class="card m">Aún no hay entrenamientos. Termina uno desde la pestaña Entrenar y aparecerá aquí.</div>';
[...S.logs].reverse().forEach(l=>{h+=`<div class="card"><div class="row" style="cursor:default"><b class="h2">${e(l.name)}</b><span class="m sm">${fmtD(l.t)}</span></div>${l.items.map(i=>`<div class="sm" style="margin-bottom:6px"><b>${e(i.n)}</b><div class="m">${i.sets.map(s=>(s.dp?'↓ ':'')+(s.w?s.w+' kg × '+s.r:s.r+' reps')+(s.x!=null?' RIR'+s.x:'')+(s.rec?' 🏆':'')).join(' · ')}</div></div>`).join('')}${del({a:'delLog',id:'L'+l.id,at:'data-id="'+l.id+'"'},'Eliminar')}</div>`});
return h}

function vExs(){return'<h1>Ejercicios</h1><input id="lq" class="in" data-f="lq" placeholder="Buscar ejercicio o músculo" autocomplete="off" style="margin-bottom:14px"><div id="lres">'+lres('')+'</div>'}

const M={peso:'Peso',reps:'Reps',e1:'1RM est.',vol:'Volumen'};
function chart(d){const W=340,H=170,p=30;const ys=d.map(x=>x.y);const rn=Math.min(...ys),rx=Math.max(...ys);let mn=rn,mx=rx;if(mn==mx){mn-=1;mx+=1}
const X=i=>p+(d.length==1?(W-2*p)/2:i*(W-2*p)/(d.length-1)),Y=v=>H-p-(v-mn)/(mx-mn)*(H-2*p);
return`<svg viewBox="0 0 ${W} ${H}" class="ch" role="img" aria-label="Gráfica de progresión"><line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" stroke="var(--bd)"/><polyline points="${d.map((x,i)=>X(i)+','+Y(x.y)).join(' ')}" fill="none" stroke="var(--a)" stroke-width="2.5" stroke-linejoin="round"/>${d.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.y)}" r="${x.pr?6:4}" fill="${x.pr?'var(--g)':'var(--a)'}"/>`).join('')}<text x="2" y="${Y(rx)+4}" class="ax">${r1(rx)}</text>${rn!=rx?`<text x="2" y="${Y(rn)+4}" class="ax">${r1(rn)}</text>`:''}<text x="${p}" y="${H-10}" class="ax">${fmtD(d[0].t)}</text><text x="${W-p}" y="${H-10}" text-anchor="end" class="ax">${fmtD(d[d.length-1].t)}</text></svg>`}

function vExd(c){const n=c.n;
const ss=S.logs.filter(l=>l.items.some(i=>i.n==n)).map(l=>{const q=l.items.find(i=>i.n==n).sets,p=q.filter(s=>!s.dp);return{t:l.t,pn:l.pn||'Sin plan',sets:q,peso:Math.max(...p.map(s=>s.w)),reps:Math.max(...p.map(s=>s.r)),e1:Math.max(...p.map(s=>s.w?s.w*(1+s.r/30):s.r)),vol:q.reduce((a,s)=>a+(s.w||1)*s.r,0)}});
let h=hd('Ejercicio')+`<h1 style="font-size:26px;margin-top:4px">${e(n)}</h1>`;
if(!ss.length)return h+'<div class="card m">Todavía no hay series registradas de este ejercicio. Termina un entrenamiento que lo incluya y aquí verás tu progresión.</div>';
const m=ui.mode;const d=ss.map((s,i)=>({t:s.t,y:s[m],pr:i>0&&s[m]>Math.max(...ss.slice(0,i).map(q=>q[m]))}));
h+=`<div class="seg">${Object.keys(M).map(k=>`<button class="${k==m?'on':''}" data-a="mode" data-m="${k}">${M[k]}</button>`).join('')}</div><div class="card">${chart(d)}<div class="m sm">Los puntos dorados son récords en esta medida.</div></div>`;
const best=(k)=>ss.reduce((a,s)=>s[k]>a[k]?s:a,ss[0]);
h+=`<div class="card"><b>Récords</b><div class="stat"><span>Peso máximo</span><b>${r1(best('peso').peso)} kg</b></div><div class="stat"><span>Más repeticiones en una serie</span><b>${best('reps').reps}</b></div><div class="stat"><span>1RM estimado</span><b>${r1(best('e1').e1)}</b></div><div class="stat"><span>Mayor volumen en una sesión</span><b>${r1(best('vol').vol)}</b></div></div>`;
{const g={};ss.forEach(s=>(g[s.pn]=g[s.pn]||[]).push(s));const ks=Object.keys(g);if(ks.length>1||ks[0]!='Sin plan')h+='<div class="m sm">Por plan o mesociclo</div><div class="card">'+ks.map(k=>{const b=g[k].reduce((a,s)=>s.peso>a.peso||(s.peso==a.peso&&s.reps>a.reps)?s:a);return`<div class="sub" style="padding:8px 0"><b>${e(k)}</b><div class="m sm">${g[k].length} ${g[k].length==1?'sesión':'sesiones'} · mejor ${b.peso?r1(b.peso)+' kg · 1RM est. '+r1(Math.max(...g[k].map(s=>s.e1))):b.reps+' reps'}</div></div>`}).join('')+'</div>'}
h+='<div class="m sm">Sesiones</div><div class="card">'+[...ss].reverse().map(s=>`<div class="sub" style="padding:8px 0"><b>${fmtD(s.t)}</b><div class="m sm">${s.sets.map(x=>(x.dp?'↓ ':'')+(x.w?x.w+' kg × '+x.r:x.r+' reps')+(x.x!=null?' RIR'+x.x:'')+(x.rec?' 🏆':'')).join(' · ')}</div></div>`).join('')+'</div>';
return h}

function render(){const c=cur(),V={home:vHome,pick:vPick,plan:vPlan,routine:vRoutine,session:vSession,done:vDone,hist:vHist,exs:vExs,tech:vTech,bk:vBk,exd:vExd};
$('app').innerHTML=V[c.v](c);
const t0=stack[0].v;$('tabs').innerHTML=[['home','Entrenar'],['hist','Historial'],['exs','Ejercicios'],['tech','Técnicas']].map(x=>`<button class="${t0==x[0]?'on':''}" data-a="tab" data-t="${x[0]}">${x[1]}</button>`).join('')}
const nav=()=>{window.scrollTo(0,0);render()};
function startSession(rid){const r=allR().find(x=>x.id==rid);if(!r)return;
S.active={name:r.name,pn:(S.plans.find(p=>p.routines.some(q=>q.id==rid))||{}).name||'',start:Date.now(),items:r.ex.map(x=>{const l=lastSets(x.n);return{n:x.n,tech:x.tech||'',mx:x.mx||0,inc:x.inc||2.5,dp:x.tech=='Drop set'?1:0,pct:20,sets:x.s.map((t,i)=>({w:l[i]?l[i].w:(l.length?l[l.length-1].w:''),r:t,d:0}))}})};
save();ui.msg='';stack=[{v:'home'},{v:'session'}];nav()}
function finish(){const a=S.active;
const items=a.items.map((i,x)=>{const B=bests(i.n),o=[];i.sets.forEach((q,j)=>{if(!(q.d&&num(q.r)>0))return;o.push({w:num(q.w),r:num(q.r),rec:rec(B,num(q.w),num(q.r)),x:q.x===''||q.x==null?null:num(q.x)});(q.dr||[]).forEach((p,k)=>{if(p.d&&num(p.r)>0)o.push({w:dw(x,j,k),r:num(p.r),rec:'',dp:1})})});return{n:i.n,tech:i.tech,sets:o}}).filter(i=>i.sets.length);
if(!items.length){ui.msg='Marca al menos una serie con ✓ para guardar el entrenamiento.';render();return}
const l={id:uid(),t:Date.now(),name:a.name,pn:a.pn,items:items};S.logs.push(l);S.active=null;stopRest();ui.msg='';save();stack=[{v:'home'},{v:'done',id:l.id}];nav()}
const exOf=(c,id)=>rt(c).ex.find(x=>x.id==id);
const armed=(k,prev)=>{if(prev===k)return true;ui.arm=k;render();return false};
const A={
tab:d=>{stack=[{v:d.t}];nav()},
go:d=>{stack.push({v:d.v,pid:d.pid,rid:d.rid,n:d.n});nav()},
back:()=>{stack.pop();nav()},
home:()=>{stack=[{v:'home'}];nav()},
mode:d=>{ui.mode=d.m;render()},
addPlan:()=>{const v=$('np').value.trim();if(!v)return;S.plans.push({id:uid(),name:v,routines:[]});save();render()},
addRoutine:()=>{const v=$('nr').value.trim();if(!v)return;plan(cur().pid).routines.push({id:uid(),name:v,ex:[]});save();render()},
addLib:d=>{rt(cur()).ex.push(ex(d.n,[8,8,8]));save();render()},
delEx:d=>{const r=rt(cur());r.ex=r.ex.filter(x=>x.id!=d.eid);save();render()},
addSet:d=>{const x=exOf(cur(),d.eid);x.s.push(x.s[x.s.length-1]||8);save();render()},
delSet:d=>{const x=exOf(cur(),d.eid);if(x.s.length>1)x.s.pop();save();render()},
delPlan:(d,p)=>{if(!armed('dp',p))return;S.plans=S.plans.filter(x=>x.id!=cur().pid);save();stack=[{v:'home'}];nav()},
delRoutine:(d,p)=>{if(!armed('dr',p))return;const pl=plan(cur().pid);pl.routines=pl.routines.filter(x=>x.id!=cur().rid);save();stack.pop();nav()},
start:d=>startSession(d.rid),
chk:d=>{const s=S.active.items[d.i].sets[d.j];s.d=s.d?0:1;if(s.d)rest();ui.msg='';save();render()},
sAdd:d=>{const q=S.active.items[d.i].sets;const l=q[q.length-1];q.push({w:l?l.w:'',r:l?l.r:8,d:0});save();render()},
tdp:d=>{const it=S.active.items[d.i];it.dp=it.dp?0:1;save();render()},
addDrop:d=>{const q=S.active.items[d.i].sets[d.j];(q.dr=q.dr||[]).push({w:'',r:q.r,d:0,m:0});save();render()},
delDrop:d=>{S.active.items[d.i].sets[d.j].dr.pop();save();render()},
chkD:d=>{const q=S.active.items[d.i].sets[d.j].dr[d.k];q.d=q.d?0:1;save();render()},
dupPlan:()=>{const p=plan(cur().pid);S.plans.push({id:uid(),name:p.name+' (siguiente)',routines:p.routines.map(r=>({id:uid(),name:r.name,ex:r.ex.map(x=>({id:uid(),n:x.n,s:[...x.s],tech:x.tech,mx:x.mx,inc:x.inc}))}))});save();stack=[{v:'home'}];nav()},
cp:()=>{const t=$('bx');t.focus();t.select();let ok=0;try{ok=document.execCommand('copy')}catch(x){}$('bm1').textContent=ok?'Copiado.':'No se pudo copiar solo: el texto está seleccionado, cópialo a mano.'},
imp:(d,p)=>{let v;try{v=JSON.parse($('bi').value)}catch(x){}if(!v||!Array.isArray(v.plans)||!Array.isArray(v.logs)){$('bm2').textContent='Ese texto no es una copia válida.';return}
if(p!=='imp'){ui.arm='imp';document.querySelector('[data-a="imp"]').textContent='¿Seguro? Se reemplazan tus datos actuales. Toca otra vez';return}
v.active=v.active||null;S=v;save();stack=[{v:'home'}];nav()},
rAdd:()=>{rEnd=Math.max(rEnd,Date.now())+15000;rDone=0;tick()},
rstop:()=>stopRest(),
fin:()=>finish(),
disc:(d,p)=>{if(!armed('disc',p))return;S.active=null;stopRest();ui.msg='';save();stack=[{v:'home'}];nav()},
delLog:(d,p)=>{if(!armed('L'+d.id,p))return;S.logs=S.logs.filter(l=>l.id!=d.id);save();render()}
};
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-a]');if(!t)return;const p=ui.arm;ui.arm=null;const f=A[t.dataset.a];if(f)f(t.dataset,p)});
document.addEventListener('input',ev=>{const t=ev.target,f=t.dataset.f;if(!f)return;const d=t.dataset,c=cur();
if(f=='pname')plan(c.pid).name=t.value;
else if(f=='rname')rt(c).name=t.value;
else if(f=='tgt')exOf(c,d.eid).s[d.i]=num(t.value);
else if(f=='sw'){S.active.items[d.i].sets[d.j].w=t.value;upd(d.i)}
else if(f=='sr')S.active.items[d.i].sets[d.j].r=t.value;
else if(f=='pct'){S.active.items[d.i].pct=num(t.value);upd(d.i)}
else if(f=='dw'){const q=S.active.items[d.i].sets[d.j].dr[d.k];q.w=t.value;q.m=t.value!==''?1:0}
else if(f=='dr')S.active.items[d.i].sets[d.j].dr[d.k].r=t.value;
else if(f=='tech')exOf(c,d.eid).tech=t.value;
else if(f=='sq')$('sres').innerHTML=sres(t.value);
else if(f=='lq')$('lres').innerHTML=lres(t.value);
else if(f=='pini')plan(c.pid).ini=t.value;
else if(f=='pfin')plan(c.pid).fin=t.value;
else if(f=='sx')S.active.items[d.i].sets[d.j].x=t.value;
else if(f=='mx')exOf(c,d.eid).mx=num(t.value);
else if(f=='inc')exOf(c,d.eid).inc=num(t.value)||2.5;
else if(f=='rs')S.rest=num(t.value)||90;
save()});
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
